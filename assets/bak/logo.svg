<?xml version="1.0" encoding="UTF-8"?>
<!--
  logo.svg —— 棋钟图标「唯一源文件」
  ================================================================
  界面上两处图标（设置页 64×64、棋钟操作条 32×32）与浏览器标签页图标
  全都引用这一个文件；想换图形，只改这里就够了。

  · 画布固定 64×64 的 viewBox，按任意尺寸缩放都不会糊；
  · 只用圆角矩形、圆、线段这几种基本图形，方便手改
    （顶部字标 CoQ 用的是系统无衬线字体，不引用任何外部字体文件）；
  · 蓝底 + 黑白两只表盘，在任何背景（深色操作条 / 浅色面板 / 浏览器标签）上都清晰。

  改完如果想同步刷新 PNG 版图标（iOS 主屏图标、老浏览器 favicon）：
      node tools/export-icons.js
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64"
     role="img" aria-labelledby="logoTitle">
  <title id="logoTitle">CoQ 棋钟</title>

  <!-- 圆角方形底 -->
  <rect x="2" y="2" width="60" height="60" rx="15" fill="#3ea6ff"/>

  <!-- 顶上那根跷跷板按键 -->
  <rect x="18" y="14" width="28" height="6" rx="3" fill="#0a0f16" opacity="0.28"/>

  <!-- 两只表盘：左＝黑方（深色面），右＝白方（浅色面），中间留 3 单位缝隙 -->
  <circle cx="20" cy="39" r="10.5" fill="#0a0f16"/>
  <circle cx="44" cy="39" r="10.5" fill="#f2f7ff"/>

  <!-- 指针（各画一短一长，像 3 点钟方向） -->
  <path d="M20 39v-5.5M20 39h5" fill="none" stroke="#f2f7ff" stroke-width="2.8" stroke-linecap="round"/>
  <path d="M44 39v-5.5M44 39h5" fill="none" stroke="#0a0f16" stroke-width="2.8" stroke-linecap="round"/>

  <!-- 顶部字标 CoQ：蓝底上留出的空隙只有 12 单位高（y=2~14），所以字号压到 10、
       基线放在 11.5，正好卡在跷跷板按键上方；深色字在蓝底上对比度足够 -->
  <text x="32" y="11.5" text-anchor="middle" fill="#0a0f16" fill-opacity="0.9"
        font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif"
        font-size="10" font-weight="700" letter-spacing="0.2">CoQ</text>
</svg>
